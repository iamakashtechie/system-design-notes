<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" opacity="0.15"/>
  
  <!-- Server nodes -->
  <rect x="30" y="75" width="40" height="50" rx="6" fill="url(#blue)" opacity="0.9"/>
  <rect x="80" y="55" width="40" height="70" rx="6" fill="url(#blue)" opacity="0.9"/>
  <rect x="130" y="75" width="40" height="50" rx="6" fill="url(#blue)" opacity="0.9"/>
  
  <!-- Server details -->
  <rect x="37" y="83" width="26" height="3" rx="1" fill="white" opacity="0.7"/>
  <rect x="37" y="90" width="20" height="3" rx="1" fill="white" opacity="0.5"/>
  <rect x="37" y="97" width="23" height="3" rx="1" fill="white" opacity="0.5"/>
  
  <rect x="87" y="63" width="26" height="3" rx="1" fill="white" opacity="0.7"/>
  <rect x="87" y="70" width="20" height="3" rx="1" fill="white" opacity="0.5"/>
  <rect x="87" y="77" width="23" height="3" rx="1" fill="white" opacity="0.5"/>
  
  <rect x="137" y="83" width="26" height="3" rx="1" fill="white" opacity="0.7"/>
  <rect x="137" y="90" width="20" height="3" rx="1" fill="white" opacity="0.5"/>
  <rect x="137" y="97" width="23" height="3" rx="1" fill="white" opacity="0.5"/>
  
  <!-- Connection lines -->
  <line x1="70" y1="100" x2="80" y2="90" stroke="url(#line)" stroke-width="2" opacity="0.6"/>
  <line x1="120" y1="90" x2="130" y2="100" stroke="url(#line)" stroke-width="2" opacity="0.6"/>
  
  <!-- Load balancer top -->
  <rect x="75" y="30" width="50" height="15" rx="7" fill="url(#accent)"/>
  <line x1="100" y1="45" x2="50" y2="75" stroke="url(#line)" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="45" x2="100" y2="55" stroke="url(#line)" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="45" x2="150" y2="75" stroke="url(#line)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Database bottom -->
  <ellipse cx="100" cy="155" rx="28" ry="8" fill="url(#green)" opacity="0.85"/>
  <rect x="72" y="148" width="56" height="14" fill="url(#green)" opacity="0.7"/>
  <ellipse cx="100" cy="148" rx="28" ry="8" fill="url(#green)" opacity="0.9"/>
  
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>
